name: Sync CV from Overleaf

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-cv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git for Submodule
        if: env.OVERLEAF_TOKEN != ''
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          git config --global url."https://suddhus:$OVERLEAF_TOKEN@git.overleaf.com/".insteadOf "https://git@git.overleaf.com/"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-index: '20'

      - name: Pull latest CV source
        run: npm run cv:pull
        continue-on-error: true

      - name: Sync CV PDF
        run: |
          if [ -f "cv_suddhu/main_v2.pdf" ]; then
            npm run cv:sync
          else
            echo "main_v2.pdf not found in cv_suddhu directory. Skipping sync."
          fi

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/cv/CV_Suddhu.pdf cv_suddhu
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-sync CV from Overleaf"
            git push
          fi
