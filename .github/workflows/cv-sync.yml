name: Sync CV from Overleaf

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-cv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Submodule URL with Token
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          if [ -n "$OVERLEAF_TOKEN" ]; then
            git submodule set-url cv_suddhu https://git:${OVERLEAF_TOKEN}@git.overleaf.com/5bf0bf3b5be7df7b92dba6ae
          else
            echo "Error: OVERLEAF_TOKEN is not set in GitHub Secrets."
            exit 1
          fi

      - name: Initialize Submodule
        run: git submodule update --init --recursive

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main_v2.tex
          working_directory: cv_suddhu

      - name: Sync CV PDF
        run: |
          if [ -f "cv_suddhu/main_v2.pdf" ]; then
            mkdir -p public/cv
            cp cv_suddhu/main_v2.pdf public/cv/CV_Suddhu.pdf
          else
            echo "main_v2.pdf was not generated. Check LaTeX compilation logs."
            exit 1
          fi

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/cv/CV_Suddhu.pdf cv_suddhu
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-compile and sync CV from Overleaf"
            git push
          fi
