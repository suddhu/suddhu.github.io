name: Sync CV from Overleaf

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-cv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Submodule URL with Token
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          if [ -n "$OVERLEAF_TOKEN" ]; then
            # Manually sync the submodule URL with the authentication token
            git submodule set-url cv_suddhu https://git:${OVERLEAF_TOKEN}@git.overleaf.com/5bf0bf3b5be7df7b92dba6ae
          else
            echo "Error: OVERLEAF_TOKEN is not set in GitHub Secrets."
            exit 1
          fi

      - name: Initialize Submodule
        run: git submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull latest CV source
        run: npm run cv:pull
        continue-on-error: true

      - name: Sync CV PDF
        run: |
          if [ -f "cv_suddhu/main_v2.pdf" ]; then
            npm run cv:sync
          else
            echo "main_v2.pdf not found in cv_suddhu directory. Skipping sync."
          fi

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/cv/CV_Suddhu.pdf cv_suddhu
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-sync CV from Overleaf"
            git push
          fi
