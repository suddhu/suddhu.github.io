name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, nextjs-version ]
  pull_request:
    branches: [ main, nextjs-version ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_BASE_PATH: ${{ github.ref == 'refs/heads/nextjs-version' && '/test' || '' }}
      
    - name: Deploy to GitHub Pages (Main Site)
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./out
        
    - name: Deploy to GitHub Pages (Test Site)
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/nextjs-version'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./out
        destination_dir: test
