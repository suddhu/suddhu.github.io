# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Overleaf Submodule
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          if [ -n "$OVERLEAF_TOKEN" ]; then
            git submodule set-url cv_suddhu https://git:${OVERLEAF_TOKEN}@git.overleaf.com/5bf0bf3b5be7df7b92dba6ae
            git submodule update --init --recursive
            git submodule update --remote --merge
          else
            echo "Warning: OVERLEAF_TOKEN is not set. Using existing CV if available."
            git submodule update --init --recursive || true
          fi

      - name: Compile LaTeX CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main_v2.tex
          working_directory: cv_suddhu
        continue-on-error: true

      - name: Sync CV PDF
        run: |
          if [ -f "cv_suddhu/main_v2.pdf" ]; then
            mkdir -p public/cv
            cp cv_suddhu/main_v2.pdf public/cv/CV_Suddhu.pdf
            
            # Commit the updated PDF back to the repo
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add public/cv/CV_Suddhu.pdf cv_suddhu
            if ! git diff --staged --quiet; then
              git commit -m "chore: auto-sync CV from Overleaf [skip ci]"
              git push || echo "Push failed, continuing with build"
            fi
          else
            echo "main_v2.pdf not found. Using existing public/cv/CV_Suddhu.pdf if it exists."
          fi

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
